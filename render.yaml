# Render Blueprint — Project Midori
# Deploy: connect repo at dashboard.render.com, or use "New > Blueprint"
services:
  - type: web
    name: projectmidori
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET
        sync: false

  # Optional: React/Next UI (enable if you want the new midori-ui deployed)
  - type: web
    name: midori-ui
    runtime: node
    rootDir: midori-ui
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "18"
